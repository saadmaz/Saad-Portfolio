<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <!-- The inline script below is allowed by a SHA-256 hash in vercel.json (CSP).
         If you edit it, `npm run build` fails and prints the new hash to paste there. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-B9DKBTHYF6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-B9DKBTHYF6");
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />


    <!-- The prerendered crawler content inside #root (scripts/prerender.mjs) is
         unstyled. Keep it in the HTML for crawlers but don't paint it for
         visitors: React replaces it on mount. If the app hasn't mounted after
         4s (slow network / JS error) it's revealed as a readable fallback, and
         it's always shown when JavaScript is disabled. -->
    <style>
      [data-prerendered] {
        visibility: hidden;
        animation: reveal-prerendered 0s 4s forwards;
      }
      @keyframes reveal-prerendered {
        to {
          visibility: visible;
        }
      }
    </style>
    <noscript>
      <style>
        [data-prerendered] {
          visibility: visible;
          animation: none;
        }
      </style>
    </noscript>

    <title>Full-Stack Developer &amp; Startup Founder - Saad Mazhar</title>

    <meta
      name="description"
      content="Saad Mazhar - startup founder, tech speaker, and full-stack developer in Colombo, Sri Lanka, building AI-powered products and web apps."
    />
    <meta name="author" content="Saad Mazhar" />
    <meta name="robots" content="index, follow" />
    <meta name="google-adsense-account" content="ca-pub-4234483250409150" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/app-icon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="alternate" type="application/rss+xml" title="Saad Mazhar - Blog" href="https://www.saadmaz.com/rss.xml" />
    <meta name="theme-color" content="#19191B" />
    <link rel="canonical" href="https://www.saadmaz.com/" />

    <!-- Preconnect for Google Fonts & Firebase CDN -->

    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com" />
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin />

    <!-- Geist + Geist Mono. Plain <link>: the CSP forbids inline onload handlers. -->

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap"

    <meta property="og:site_name" content="Saad Mazhar" />

    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.saadmaz.com" />
    <!-- Fallback card; scripts/prerender.mjs rewrites these per route (with ?v=). -->
    <meta property="og:image" content="https://www.saadmaz.com/og/home.png" />
    <meta property="og:image:alt" content="Saad Mazhar - Startup Founder &amp; Full-Stack Developer" />
    <meta property="og:image:type" content="image/png" />

    />

  </head>

  <body>
    <div id="root"></div>
    <!--
      No page-specific heading here on purpose: the build's prerender step
      (scripts/prerender.mjs) writes a real, per-route H1 and content into
      #root above. This noscript block only matters for an unprerendered
      preview (e.g. local `vite preview`), so it stays generic rather than
      duplicating - and contradicting - whichever route's H1 is above it.
    -->
    <noscript>
