name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Typecheck (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]

    defaults:
      run:
        # All commands run inside the frontend/ folder — that's where
        # package.json, package-lock.json, and the Vite config live.
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          # Tell setup-node where the lock file actually lives
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Stub Firebase env vars so Vite doesn't abort the build.
          # Real values are set in Vercel dashboard — not needed here.
          VITE_FIREBASE_API_KEY: ci-stub
          VITE_FIREBASE_AUTH_DOMAIN: ci-stub
          VITE_FIREBASE_PROJECT_ID: ci-stub
          VITE_FIREBASE_STORAGE_BUCKET: ci-stub
          VITE_FIREBASE_MESSAGING_SENDER_ID: ci-stub
          VITE_FIREBASE_APP_ID: ci-stub
