name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test & build
    runs-on: ubuntu-latest

    defaults:
      run:
        # package.json, package-lock.json and all tooling live in frontend/.
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0 # git hooks are for local commits only

      # Checks app, api/ and vite config projects. (A bare `tsc` on the root
      # tsconfig.json checks nothing - it only holds project references.)
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Stub Firebase env vars so Vite doesn't abort the build.
          # Real values are set in the Cloudflare Pages dashboard.
          VITE_FIREBASE_API_KEY: ci-stub
          VITE_FIREBASE_AUTH_DOMAIN: ci-stub
          VITE_FIREBASE_PROJECT_ID: ci-stub
          VITE_FIREBASE_STORAGE_BUCKET: ci-stub
          VITE_FIREBASE_MESSAGING_SENDER_ID: ci-stub
          VITE_FIREBASE_APP_ID: ci-stub
